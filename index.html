<!doctype html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0f10" />
  <title>Darts</title>
  <link rel="icon" href="assets/darts.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <div id="board-container" class="board-container" aria-label="Interaktív darts tábla">
      <img id="board" src="assets/darts.png" alt="Darts board" class="board" draggable="false" />
      <svg id="hotspot-layer" class="hotspot-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg>
      <div id="text-layer"></div>
      <div id="circle-layer"></div>
    </div>
  </main>

  <div id="overlay" class="overlay" hidden>
    <div class="popup" role="dialog" aria-modal="true" aria-labelledby="popup-title">
      <h2 id="popup-title"></h2>
      <p id="popup-rule"></p>
    </div>
  </div>

  <div id="error" class="error" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
